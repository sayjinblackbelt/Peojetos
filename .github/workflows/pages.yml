name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "automation/output/**"
      - "automation/sample_data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages package
        run: |
          mkdir -p _site
          cp -r web/* _site/
          mkdir -p _site/automation/output
          cp automation/output/*.png _site/automation/output/ 2>/dev/null || true
          mkdir -p _site/automation/sample_data
          cp automation/sample_data/*.csv _site/automation/sample_data/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
