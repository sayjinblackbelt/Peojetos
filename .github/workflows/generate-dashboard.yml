name: Generate PMO Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - ".github/workflows/generate-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Generate dashboard
        run: python automation/generate_visual_dashboard.py

      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/output/
          git diff --cached --quiet || git commit -m "chore: update generated PMO dashboard"
          git push
